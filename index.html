<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sketch, write LaTeX math, and turn Mermaid code into editable shapes. Export PNG, SVG, PDF or .excalidraw. Works offline. No login, no tracking." />
    <!-- Browser chrome color (Chromium address bar, Safari tab and toolbar tint) matches the canvas. App.tsx rewrites both tags when the in-app theme toggle overrides the system scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <!-- Installable PWA: standalone display + iOS web-app hints. Keep in sync with the VitePWA manifest in vite.config.ts. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="draw" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <!-- Favicons: SVG primary, ICO (16/32/48) for legacy /favicon.ico requests, opaque apple-touch-icon for iOS. Regenerate with npm run assets:brand. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Social cards. No canonical: the page is noindex. og.png renders from .github/brand/og.svg (npm run brand:images). Keep in sync with src/siteMeta.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://draw.marcopontili.com/" />
    <meta property="og:site_name" content="draw" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="draw · Whiteboard with LaTeX, Mermaid and Markdown" />
    <meta property="og:description" content="Sketch, write LaTeX math, and turn Mermaid code into editable shapes. Export PNG, SVG, PDF or .excalidraw. Works offline. No login, no tracking." />
    <meta property="og:image" content="https://draw.marcopontili.com/og.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="draw: an Excalidraw whiteboard with LaTeX, Markdown and PDF export" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Keep in sync with src/siteMeta.ts (SITE_PAGE_TITLE) -->
    <title>draw · Whiteboard with LaTeX, Mermaid and Markdown</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
