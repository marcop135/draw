name: Bug report
description: Report a defect in the whiteboard or its build.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://draw.marcopontili.com
        2. Insert LaTeX / Mermaid / Markdown
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include console errors if any.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      options:
        - Canvas / Excalidraw
        - LaTeX insert
        - Mermaid insert
        - Markdown insert
        - Export (PNG/JPEG/SVG/PDF/.excalidraw)
        - Theme / PWA
        - Agent bridge (window.draw)
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 130, Safari 18
    validations:
      required: true
