name: Deploy site to production (manual)

# Manual-only. Triggered from the GitHub UI ("Run workflow" button on the
# Actions tab) or via `gh workflow run "Deploy site to production (manual)"`.
# Push events deliberately do NOT trigger this; pushes/merges to main land
# the code, deploys are an explicit decision.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - run: npm run test
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

      # Prefer SFTP (lftp mirror over ssh), fall back to FTPS with retries.
      # The shared host's FTPS control socket idles out intermittently
      # ("connect ETIMEDOUT :21 (control socket)"), so a plain FTPS deploy
      # flakes; SFTP avoids that when :22 is reachable. lftp's own retry/
      # timeout settings cover transient drops on whichever transport wins.
      # If SFTP can't connect on :22, set an SFTP_PORT secret (or the FTPS
      # branch handles it). dist/ is mirrored into the web root (server-dir ./).
      - name: Deploy (prefer SFTP, fall back to FTPS)
        env:
          DEPLOY_HOST: ${{ secrets.FTP_HOST }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME_PRODUCTION }}
          DEPLOY_PASS: ${{ secrets.FTP_PASSWORD_PRODUCTION }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          PORT="${SFTP_PORT:-22}"
          COMMON="set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 10; set mirror:parallel-transfer-count 1;"
          echo "::group::Attempt SFTP (sftp://$DEPLOY_HOST:$PORT)"
          if lftp -c "set sftp:auto-confirm yes; $COMMON open -u \"$DEPLOY_USER\",\"$DEPLOY_PASS\" sftp://$DEPLOY_HOST:$PORT; mirror -R --verbose ./dist/ ./"; then
            echo "::endgroup::"
            echo "Deployed via SFTP."
            exit 0
          fi
          echo "::endgroup::"
          echo "SFTP failed; falling back to FTPS on :21."
          echo "::group::Attempt FTPS (ftp://$DEPLOY_HOST:21)"
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; $COMMON open -u \"$DEPLOY_USER\",\"$DEPLOY_PASS\" ftp://$DEPLOY_HOST:21; mirror -R --verbose ./dist/ ./"
          echo "::endgroup::"
          echo "Deployed via FTPS."
